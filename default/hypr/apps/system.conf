# Floating windows
windowrule {
  name = windowrule-1
  float = on
  center = on
  size = 875 600
  match:tag = floating-window
}


windowrule {
  name = windowrule-2
  tag = +floating-window
  match:class = (org.omarchy.bluetui|org.omarchy.impala|org.omarchy.wiremix|org.omarchy.btop|org.omarchy.terminal|org.omarchy.bash|org.gnome.NautilusPreviewer|org.gnome.Evince|com.gabm.satty|Omarchy|About|TUI.float|imv|mpv)
}

windowrule {
  name = windowrule-3
  tag = +floating-window
  match:class = (xdg-desktop-portal-gtk|sublime_text|DesktopEditors|org.gnome.Nautilus)
  match:title = ^(Open.*Files?|Open [F|f]older.*|Save.*Files?|Save.*As|Save|All Files|.*wants to [open|save].*|[C|c]hoose.*)
}

windowrule {
  name = windowrule-4
  float = on
  match:class = org.gnome.Calculator
}


# Fullscreen screensaver
windowrule {
  name = windowrule-5
  fullscreen = on
  float = on
  match:class = org.omarchy.screensaver
}


# No transparency on media windows
windowrule {
  name = windowrule-6
  opacity = 1 1
  match:class = ^(zoom|vlc|mpv|org.kde.kdenlive|com.obsproject.Studio|com.github.PintaProject.Pinta|imv|org.gnome.NautilusPreviewer)$
}


# Popped window rounding
windowrule {
  name = windowrule-7
  rounding = 8
  match:tag = pop
}


# Prevent idle while open
windowrule {
  name = windowrule-8
  idle_inhibit = always
  match:tag = noidle
}

